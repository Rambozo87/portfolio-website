name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Scheduled runs keep the site in sync with the independent portfolio repo.
    - cron: '17 * * * *'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Check out website
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: portfolio-website
          persist-credentials: false
          fetch-depth: 1

      - name: Check out portfolio content
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Rambozo87/portfolio
          ref: main
          path: portfolio
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: portfolio-website/package-lock.json

      - name: Install website dependencies
        working-directory: portfolio-website
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm ci

      - name: Test website
        working-directory: portfolio-website
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm test

      - name: Build static website
        working-directory: portfolio-website
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: portfolio-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
